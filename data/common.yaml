---
message: "This is the deepest hiera level, common to all nodes"


classes:
  - profile::chrony
  - profile::ssh
  #- profile::sudoers
  - profile::timezone
  - profile::users

profile::ssh::allow_users:
  - root
  - user1
  - user2

profile::users::users:
  user1:
    ensure: present
    uid: 1001
    gid: 1001
    groups:
      - users
  user2:
    ensure: present
    uid: 1002
    gid: 1002
    groups:
      - users

profile::sudoers::users:
  - user1
  - user2
  - vagrant