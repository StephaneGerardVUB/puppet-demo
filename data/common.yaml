---
message: "This is the deepest hiera level, common to all nodes"


classes:
  - profiles::chrony
  #- profiles::ssh
  #- profiles::sudoers
  - profiles::timezone
  - profiles::users

profiles::ssh::allow_users:
  - root
  - user1
  - user2

profiles::users::users:
  user1:
    ensure: present
    uid: 1001
    gid: 1001
    groups:
      - users
  user2:
    ensure: present
    uid: 1002
    gid: 1002
    groups:
      - users

profiles::sudoers::users:
  - user1
  - user2
  - vagrant