# Default Hiera values for Puppet
---
msg: "serving %{::role} role"

# SLURM version
slurm::version: '24.05.4'
# src_checksum empty string -> we don't perform checksum tests on the tarball
slurm::src_checksum: ''

# SLURM general settings
slurm::clustername: 'cluster'
slurm::controlmachine: 'slurmctrl'
slurm::accountingstoragehost: 'slurmctrl'
slurm::uid: 900
slurm::gid: 900
slurm::service_manage: true

# SLURM nodes and partitions and QOS
slurm::nodes:
  'node-1':
    comment: 'Compute node 1'
    content: 'CPUs=2 Sockets=2 CoresPerSocket=1 ThreadsPerCore=1 RealMemory=4096 State=UNKNOWN'
  'node-2':
    comment: 'Compute node 2'
    content: 'CPUs=2 Sockets=2 CoresPerSocket=1 ThreadsPerCore=1 RealMemory=4096 State=UNKNOWN'
slurm::partitions:
  'DEFAULT':
    content: 'State=UP AllowGroups=clusterusers AllowAccounts=ALL DisableRootJobs=YES OverSubscribe=NO'
  'admin':
    priority: 100
    content: 'Hidden=YES DefaultTime=0-10:00:00 MaxTime=5-00:00:00 MaxNodes=UNLIMITED  AllowQos=qos-admin'
  'interactive':
    nodes: 'node-1'
    priority: 20
    content: 'DefaultTime=0-1:00:00  MaxTime=0-4:00:00  AllowQos=qos-besteffort,qos-interactive'
  'batch':
    nodes: 'node-[1-2]'
    priority: 20
    content: 'DefaultTime=0-2:00:00  MaxTime=5-00:00:00 MaxNodes=UNLIMITED Default=YES'
slurm::qos:
  'qos-besteffort':
    priority: 0
  'qos-batch':
    priority: 100
    preempt: 'qos-besteffort'
  'qos-admin':
    priority: 1000
  'qos-interactive':
    preempt: 'qos-besteffort'

## SlurmDBD settings
slurm::slurmdbd::dbdhost: 'localhost'
slurm::slurmdbd::dbdaddr: 'localhost'
slurm::slurmdbd::storagehost: "%{facts.networking.hostname}"
slurm::slurmdbd::storageloc: 'slurm'
slurm::slurmdbd::storageport: 3306
slurm::slurmdbd::storagetype: 'mysql'
slurm::slurmdbd::innodb_buffer_pool_size: '2048M'
slurm::slurmdbd::innodb_log_file_size: '64M'


# MUNGE Authentication
slurm::manage_munge: true
slurm::munge_create_key: false
slurm::munge_uid: 950
slurm::munge_gid: 950
# Below key content should be normally encrypted with eyaml on prod systems
#
slurm::munge_key_content: 'GNAimY7vUIYoAiBgriWflMvK1vFzRPxm6kcVu/wduKI'

# Slurm.conf parameters
slurm::batchstarttimeout: 60
slurm::getenvtimeout: 5

slurm::acct_storageenforce:
  - 'qos'
  - 'limits'
  - 'associations'
slurm::acct_gatherenergytype: 'rapl'

#slurm::defmempercpu: 4096
#slurm::maxmempercpu: 27000
slurm::schedulertype: 'backfill'
slurm::selecttype: 'cons_tres'
slurm::selecttype_params:
  - 'CR_Core_Memory'
  - 'CR_CORE_DEFAULT_DIST_BLOCK'

slurm::grestypes:
  - 'gpu'

slurm::licenses: 'forge:576,perfreport:64'
slurm::mpidefault: 'pmi2'
slurm::mpiparams: 'ports=55000-59999'
slurm::srunportrange: '40000-50000'
slurm::jobrequeue: false

slurm::priorityweightage: 2000
slurm::priorityweightfairshare: 10000
slurm::priorityweightpartition: 1000
slurm::priorityweightqos: 1
slurm::priorityflags:
  - 'DEPTH_OBLIVIOUS'
slurm::prologflags:
  - 'Alloc'
  - 'Contain'
  - 'X11'
slurm::messagetimeout: 30
slurm::resumetimeout: 600
slurm::taskplugin: ['affinity', 'cgroup']
slurm::taskpluginparams :
  - 'none'

###############################
### cgroup.conf settings     ###
#################################
# new default in 18.08 SLURM and related to bug
# https://bugs.schedmd.com/show_bug.cgi?id=5507
slurm::cgroup_constrainkmemspace: false
# ensure job constraints on GRES such as GPUs
slurm::cgroup_constraindevices: true
slurm::cgroup_alloweddevices:
  - '/dev/null'
  - '/dev/urandom'
  - '/dev/zero'
  - '/dev/sda*'
  - '/dev/cpu/*/*'
  - '/dev/pts/*'
  - '/dev/nvme0*'


### PAM Pluggable Authentication Modules (PAM)
slurm::pam::allowed_users:
  - vagrant
